name: brewery
options:
  bundleIdPrefix: com.tuesdaymorning
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  brewery:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: brewery
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko, ja, zh-Hans, es, de, fr]
        CFBundleDisplayName: brewery
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Memory(기억) · bymemory.dev"
    entitlements:
      path: Sources/brewery.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuesdaymorning.brewery
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
  breweryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: brewery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuesdaymorning.breweryTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  brewery:
    build:
      targets:
        brewery: all
        breweryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - breweryTests
